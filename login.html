<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | Nuevo Sol Inversiones</title>
  <meta name="description" content="Accede a tu cuenta de Nuevo Sol Inversiones para publicar y gestionar tus propiedades.">
  <link rel="stylesheet" href="css/variables.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-body);
      background-color: var(--color-navy-dark);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
    }

    /* Background decorative elements */
    body::before {
      content: '';
      position: fixed;
      top: -30%;
      right: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(197, 165, 90, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }
    body::after {
      content: '';
      position: fixed;
      bottom: -20%;
      left: -10%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(31, 58, 99, 0.5) 0%, transparent 70%);
      pointer-events: none;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 3rem;
      width: 100%;
      max-width: 460px;
      position: relative;
      z-index: 1;
      box-shadow: 0 32px 80px rgba(0,0,0,0.5);
    }

    .auth-logo {
      display: block;
      width: 160px;
      margin: 0 auto 2rem;
    }

    .auth-title {
      font-family: var(--font-display);
      font-size: 1.75rem;
      font-weight: 700;
      color: #fff;
      text-align: center;
      margin-bottom: 0.5rem;
    }

    .auth-subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.5rem;
    }

    input {
      width: 100%;
      padding: 0.875rem 1.125rem;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9375rem;
      font-family: var(--font-body);
      transition: all 0.25s ease;
    }

    input::placeholder { color: rgba(255,255,255,0.3); }
    input:focus {
      outline: none;
      border-color: var(--color-gold);
      background: rgba(255,255,255,0.08);
      box-shadow: 0 0 0 4px rgba(197, 165, 90, 0.15);
    }

    .btn-primary {
      width: 100%;
      padding: 1rem;
      background: var(--gradient-gold);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: var(--font-display);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: all 0.3s ease;
      letter-spacing: 0.02em;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(197, 165, 90, 0.4);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .auth-divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.75rem 0;
    }

    .auth-divider::before, .auth-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.1);
    }

    .auth-divider span {
      color: rgba(255,255,255,0.35);
      font-size: 0.75rem;
    }

    .auth-link {
      text-align: center;
      color: rgba(255,255,255,0.5);
      font-size: 0.875rem;
    }

    .auth-link a {
      color: var(--color-gold);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-link a:hover { text-decoration: underline; }

    .error-msg {
      background: rgba(198, 40, 40, 0.15);
      border: 1px solid rgba(198, 40, 40, 0.3);
      border-radius: 10px;
      padding: 0.875rem 1rem;
      color: #ff8a80;
      font-size: 0.875rem;
      margin-top: 1rem;
      display: none;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: rgba(255,255,255,0.4);
      font-size: 0.8125rem;
      text-decoration: none;
      margin-bottom: 2rem;
      transition: color 0.2s ease;
    }

    .back-link:hover { color: var(--color-gold); }

    .forgot-link {
      display: block;
      text-align: right;
      color: rgba(255,255,255,0.4);
      font-size: 0.8125rem;
      text-decoration: none;
      margin-top: 0.375rem;
      transition: color 0.2s ease;
    }
    .forgot-link:hover { color: var(--color-gold); }
  </style>
</head>
<body>
  <div class="auth-card">
    <a href="index.html" class="back-link">← Volver al inicio</a>

    <img src="Nuevo Sol LOGO (Transparente).png" alt="Nuevo Sol Inversiones" class="auth-logo">
    <h1 class="auth-title">Bienvenido de vuelta</h1>
    <p class="auth-subtitle">Inicia sesión para publicar y gestionar tus propiedades</p>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="tu@correo.com" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password">
        <a href="#" class="forgot-link" id="forgotLink">¿Olvidaste tu contraseña?</a>
      </div>

      <button type="submit" class="btn-primary" id="loginBtn">Iniciar Sesión</button>
      <div class="error-msg" id="errorMsg"></div>
    </form>

    <div class="auth-divider"><span>¿No tienes cuenta?</span></div>
    <p class="auth-link">
      <a href="registro.html">Crear una cuenta nueva</a>
    </p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBMHuristbpJdUIFbGXYNSNq-DzXzoKbJw",
      authDomain: "nuevo-sol-inversiones-app.firebaseapp.com",
      projectId: "nuevo-sol-inversiones-app",
      storageBucket: "nuevo-sol-inversiones-app.firebasestorage.app",
      messagingSenderId: "468690027360",
      appId: "1:468690027360:web:160448f95e751392dc1405"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Redirigir si ya está autenticado
    onAuthStateChanged(auth, (user) => {
      if (user) {
        const redirect = sessionStorage.getItem('redirectAfterLogin') || 'formulario-publicar.html';
        sessionStorage.removeItem('redirectAfterLogin');
        window.location.href = redirect;
      }
    });

    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const errorMsg = document.getElementById('errorMsg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      btn.textContent = 'Ingresando...';
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);
        // onAuthStateChanged manejará la redirección
      } catch (error) {
        let msg = 'Correo o contraseña incorrectos. Intenta de nuevo.';
        if (error.code === 'auth/too-many-requests') {
          msg = 'Demasiados intentos fallidos. Espera unos minutos o restablece tu contraseña.';
        } else if (error.code === 'auth/user-not-found') {
          msg = 'No existe una cuenta con ese correo. ¿Quieres registrarte?';
        }
        errorMsg.textContent = msg;
        errorMsg.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });

    document.getElementById('forgotLink').addEventListener('click', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      if (!email) {
        errorMsg.textContent = 'Escribe tu correo arriba para restablecer tu contraseña.';
        errorMsg.style.display = 'block';
        return;
      }
      try {
        await sendPasswordResetEmail(auth, email);
        errorMsg.style.background = 'rgba(46, 125, 50, 0.15)';
        errorMsg.style.borderColor = 'rgba(46, 125, 50, 0.3)';
        errorMsg.style.color = '#69f0ae';
        errorMsg.textContent = 'Te enviamos un enlace a tu correo para restablecer tu contraseña.';
        errorMsg.style.display = 'block';
      } catch {
        errorMsg.textContent = 'No pudimos enviar el correo. Verifica que la dirección sea correcta.';
        errorMsg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
